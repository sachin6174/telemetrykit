name: Release

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing semantic-version tag to publish, for example v1.2.3
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TK_SCHEME: TelemetryKit
  TK_PRODUCT: TelemetryKit
  TK_FRAMEWORK_NAME: TelemetryKit
  TK_IOS_DEPLOYMENT_TARGET: "15.0"
  TK_RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  release:
    name: Build and publish
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      TK_DERIVED_DATA_PATH: ${{ runner.temp }}/TelemetryKitReleaseDerivedData
      TK_OUTPUT_DIRECTORY: ${{ runner.temp }}/TelemetryKitRelease
      TK_SWIFT_SAMPLE_CONTAINER: Examples/SwiftDemo/SwiftDemo.xcodeproj
      TK_SWIFT_SAMPLE_SCHEME: SwiftDemo
      TK_OBJC_SAMPLE_CONTAINER: Examples/ObjectiveCDemo/ObjectiveCDemo.xcodeproj
      TK_OBJC_SAMPLE_SCHEME: ObjectiveCDemo
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Verify release tag
        run: |
          set -euo pipefail
          if [[ ! "$TK_RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "error: release tag must use semantic versioning (vMAJOR.MINOR.PATCH)" >&2
            exit 1
          fi
          tag_commit="$(git rev-list -n 1 "$TK_RELEASE_TAG")"
          head_commit="$(git rev-parse HEAD)"
          if [[ "$tag_commit" != "$head_commit" ]]; then
            echo "error: checked-out commit does not match $TK_RELEASE_TAG" >&2
            exit 1
          fi
          sdk_version="$(sed -nE 's/^[[:space:]]*static let version = "([^"]+)"$/\1/p' Sources/TelemetryKit/Pipeline/WireEnvelope.swift)"
          if [[ -z "$sdk_version" || "v$sdk_version" != "$TK_RELEASE_TAG" ]]; then
            echo "error: release tag $TK_RELEASE_TAG does not match SDK wire version ${sdk_version:-missing}" >&2
            exit 1
          fi

      - name: Print toolchain
        run: |
          set -euo pipefail
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          set -euo pipefail
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi

      - name: Generate sample projects
        run: bash Scripts/generate-samples.sh

      - name: Validate release source
        run: bash Scripts/validate-package.sh

      - name: Build XCFramework release artifacts
        run: bash Scripts/build-xcframework.sh

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TelemetryKit-${{ env.TK_RELEASE_TAG }}
          path: |
            ${{ runner.temp }}/TelemetryKitRelease/TelemetryKit.xcframework.zip
            ${{ runner.temp }}/TelemetryKitRelease/TelemetryKit.xcframework.zip.checksum
            ${{ runner.temp }}/TelemetryKitRelease/TelemetryKit.xcframework.zip.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_files=(
            "$TK_OUTPUT_DIRECTORY/TelemetryKit.xcframework.zip"
            "$TK_OUTPUT_DIRECTORY/TelemetryKit.xcframework.zip.checksum"
            "$TK_OUTPUT_DIRECTORY/TelemetryKit.xcframework.zip.sha256"
          )

          if gh release view "$TK_RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$TK_RELEASE_TAG" "${release_files[@]}" --clobber
          else
            release_arguments=(
              release create "$TK_RELEASE_TAG"
              "${release_files[@]}"
              --verify-tag
              --generate-notes
              --title "TelemetryKit $TK_RELEASE_TAG"
            )
            if [[ "$TK_RELEASE_TAG" == *-* ]]; then
              release_arguments+=(--prerelease)
            fi
            gh "${release_arguments[@]}"
          fi
